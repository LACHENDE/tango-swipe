<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="単語">
<title>Tango Swipe</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}
/* Layout: a classroom blackboard (the desk) holding a ring-bound pack of 単語カード, the paper flashcards Japanese students flip through.
   One card on screen at a time, swiped up like a feed; HUD written in chalk above, chalk tray tabs below. Single deliberate look. */
:root{
  --board:#1f3b33; --board-2:#28483f; --board-3:#355a50; --chalk:#f1f2ea; --chalk-dim:#aebdb5; --chalk-line:rgba(241,242,234,.18);
  --ink-pen:#23231f; --ink-soft:#5f5d55; --paper:#fffdf6; --rule:#d5dbe6; --pen-red:#d23b2f; --pen-blue:#2c4f9e; --tape:#f3c94b; --wood:#8a6a45;
  --p-h:#ffd6de; --p-k:#c9ecd9; --p-n5:#cde0fa; --p-n4:#fbe8a0; --p-n3:#e0d3f6;
  /* tokens the script refers to */
  --ink:var(--board); --ink-2:var(--board-2); --ink-3:var(--board-3); --fg:var(--chalk); --muted:var(--chalk-dim); --line:var(--chalk-line);
  --gold:var(--tape); --good:var(--pen-red); --bad:var(--pen-blue);
  --c-h:var(--p-h); --c-k:var(--p-k); --c-n5:var(--p-n5); --c-n4:var(--p-n4); --c-n3:var(--p-n3);
  --f-jp:"Klee","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Hiragino Sans","PingFang SC","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
/* Anything printed on paper switches the text tokens to pen ink */
.card,.panel,.tile,.mini,.sp-stage,.opt,.reveal,.pk-c,#toast,.rowchips button,.seg button,.btn{
  --fg:var(--ink-pen); --muted:var(--ink-soft); --line:rgba(35,35,31,.18); --ink-3:#ecebe3; color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--board);color:var(--chalk);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(120% 80% at 30% 10%,rgba(255,255,255,.06),transparent 60%),radial-gradient(80% 60% at 90% 90%,rgba(0,0,0,.18),transparent 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px dashed var(--tape);outline-offset:3px}
.jp{font-family:var(--f-jp)}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}

/* HUD in chalk */
#hud{display:flex;align-items:center;gap:14px;padding:10px 16px 4px}
.streak{display:flex;align-items:baseline;gap:3px;font-family:var(--f-jp);font-weight:600;font-size:15px;min-width:64px;color:var(--chalk)}
.streak svg{display:none}
.streak::before{content:"連続";font-size:12px;color:var(--chalk-dim);margin-right:2px}
.streak::after{content:"日";font-size:12px;color:var(--chalk-dim)}
.streak span{font-size:22px;font-variant-numeric:tabular-nums}
.streak.cold span{color:var(--chalk-dim)}
.lvl{flex:1;min-width:0}
.lvl-top{display:flex;justify-content:space-between;font-size:12px;color:var(--chalk-dim);margin-bottom:5px;font-variant-numeric:tabular-nums}
.lvl-top b{color:var(--chalk);font-weight:700}
.bar{height:9px;border-radius:2px;border:1.5px solid var(--chalk-dim);overflow:hidden;padding:1px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-60deg,var(--chalk) 0 3px,rgba(241,242,234,.75) 3px 5px);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.goal{position:relative;width:44px;height:44px;flex:none}
.goal svg{width:44px;height:44px;transform:rotate(-90deg)}
.goal svg circle:first-child{stroke:var(--chalk-line)}
.goal svg #goal-ring{stroke:var(--chalk)}
.goal span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* Views */
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
#v-feed{overflow:hidden;padding:0}
#feed{position:absolute;inset:0;touch-action:none;overflow:hidden}

/* 単語カード: ruled paper in the stage's pack colour, punched hole and ring at the top */
.card{position:absolute;inset:22px 16px 12px;border-radius:14px;padding:30px 18px 14px;display:flex;flex-direction:column;color:var(--ink-pen);
  background:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(44,79,158,.13) 33px 34px) 0 74px/100% calc(100% - 74px) no-repeat,var(--sc);
  box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 0 -4px color-mix(in srgb,var(--sc) 70%,#000 12%),0 18px 30px -12px rgba(0,0,0,.5);
  transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.card::before{content:"";position:absolute;top:12px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--board);box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.card::after{content:"";position:absolute;top:-16px;left:50%;width:24px;height:36px;margin-left:-12px;border:4px solid #c9ccc8;border-bottom-color:transparent;border-radius:14px 14px 0 0;
  background:none;box-shadow:inset 1px 0 0 #fff;pointer-events:none}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border:1.5px solid var(--ink-pen);border-radius:3px;color:var(--ink-pen);background:transparent;text-transform:uppercase}
.chip.stage{font-family:var(--f-jp);letter-spacing:0;text-transform:none;font-weight:600}
.chip.new{border:0;background:var(--tape);background:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px),var(--tape);transform:rotate(-3deg);padding:5px 12px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.chip.speak{border:0;background:var(--ink-pen);color:var(--paper)}
.combo{margin-left:auto;font-family:var(--f-jp);font-weight:600;font-size:17px;color:var(--pen-red);font-variant-numeric:tabular-nums}
.combo.pop{animation:pop .45s}
.prompt{margin-top:12px;font-size:15px;color:var(--ink-soft)}
.word-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0;text-align:center}
.word{font-family:var(--f-jp);font-weight:600;line-height:1.1;font-size:min(30vw,calc(80vw / var(--len)),130px);word-break:keep-all;color:var(--ink-pen)}
@media (min-width:560px){.word{font-size:min(150px,calc(440px / var(--len)))}}
.word.meaning{font-family:var(--f-ui);font-weight:700;font-size:min(11vw,48px);line-height:1.2;text-wrap:balance}
.say{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;border:1.5px solid var(--ink-pen);font-size:14px;font-weight:500;background:var(--paper)}
.say svg{width:17px;height:17px}
.reveal{width:100%;border-radius:8px;border:2px dashed rgba(35,35,31,.35);background:rgba(255,255,255,.5);padding:12px 16px;text-align:center;min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:2px;color:var(--ink-pen)}
.reveal .tap{color:var(--ink-soft);font-size:15px}
.reveal .rd{font-family:var(--f-jp);font-size:28px;font-weight:600}
.reveal .ro{color:var(--ink-soft);font-size:15px;letter-spacing:.03em}
.reveal .mn{font-size:22px;font-weight:700;color:var(--pen-blue);text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;min-height:62px;border-radius:10px;background:var(--paper);border:2px solid var(--ink-pen);box-shadow:0 3px 0 var(--ink-pen);padding:8px 10px;font-size:17px;font-weight:500;line-height:1.2;color:var(--ink-pen);transition:transform .08s,box-shadow .08s;overflow-wrap:anywhere}
.opt.jpo{font-family:var(--f-jp);font-size:23px;font-weight:600}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink-pen)}
/* teacher's red pen: a circle round the right answer, a cross on the wrong one */
.opt.right::after{content:"";position:absolute;inset:-7px -4px;border:3.5px solid var(--pen-red);border-radius:50%;transform:rotate(-4deg);animation:circle .35s ease-out both;pointer-events:none}
.opt.wrong{animation:shake .4s;color:var(--ink-soft)}
.opt.wrong::after{content:"×";position:absolute;right:6px;top:50%;transform:translateY(-55%);font-family:var(--f-jp);font-size:40px;line-height:1;color:var(--pen-red);pointer-events:none}
.opt.dim{opacity:.45}
.feedback{text-align:center;min-height:30px;margin:8px 0 2px;font-size:17px;font-weight:600}
.feedback .praise{font-family:var(--f-jp);font-weight:600;font-size:26px;color:var(--pen-red);display:inline-block;transform:rotate(-3deg)}
.feedback .oops{color:var(--pen-blue)}
.info{text-align:center;font-size:15px;color:var(--ink-soft);min-height:22px}
.info b{color:var(--ink-pen);font-family:var(--f-jp);font-weight:600}
.hint{margin:8px auto 0;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;padding:4px 18px;opacity:.35;transition:opacity .3s}
.hint svg{width:22px;height:22px}
.card.done .hint{opacity:1;color:var(--ink-pen)}
.card.done .hint svg{animation:bob 1.2s infinite}
.card.nudge{animation:nudge .4s}
.msg-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.msg-body .big{font-family:var(--f-jp);font-weight:600;font-size:min(12vw,50px);line-height:1.2;text-wrap:balance}
.msg-body p{font-size:16px;color:var(--ink-soft);max-width:30ch;line-height:1.5;margin:0}
.btn{padding:12px 20px;border-radius:10px;background:var(--tape);color:var(--ink-pen);font-weight:700;font-size:16px;border:2px solid var(--ink-pen);box-shadow:0 3px 0 var(--ink-pen)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:var(--paper)}
.xp-float{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--f-jp);font-weight:600;font-size:30px;color:var(--pen-red);pointer-events:none;animation:floatup 1s forwards}

/* Chalk tray tabs */
#tabs{display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:5px solid var(--wood);background:var(--board-2)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0;color:var(--chalk-dim);font-size:11px}
#tabs button .k{font-family:var(--f-jp);font-size:20px;font-weight:600}
#tabs button[aria-selected="true"]{color:var(--chalk)}
#tabs button[aria-selected="true"] .k{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--tape)}

/* Pages: chalk headings, paper sheets */
h2{font-family:var(--f-jp);font-size:24px;font-weight:600;margin:14px 0 6px;text-wrap:balance}
h3{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px;line-height:1.5}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile,.panel{background:var(--paper);color:var(--ink-pen);border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tile{padding:12px 14px;border-top:6px solid var(--p-n5)}
.tile:nth-child(3n+2){border-top-color:var(--p-h)} .tile:nth-child(3n){border-top-color:var(--p-n4)}
.tile .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
.panel{padding:14px}
.stage-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px dashed rgba(35,35,31,.2)}
.stage-row:last-child{border-bottom:0}
.stage-row .badge{width:44px;height:44px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-jp);font-weight:600;font-size:22px;background:var(--sc);color:var(--ink-pen);border:1.5px solid var(--ink-pen);grid-row:span 2}
.stage-row .nm{font-weight:700;font-size:16px}
.stage-row .nm small{color:var(--ink-soft);font-weight:400;font-size:13px;margin-left:6px}
.stage-row .ct{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:right}
.stage-row .bar{grid-column:2 / 4;border-color:var(--ink-pen)}
.stage-row .bar i{background:var(--sc);background-image:none}
.stage-row.locked{opacity:.5}
.stage-row button.more{font-size:13px;color:var(--pen-blue);padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.wgrid{grid-column:1 / 4;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wchip{font-family:var(--f-jp);font-size:16px;padding:3px 9px;border-radius:4px;background:#f1f0e8;color:#9b998f}
.wchip.b1,.wchip.b2{background:var(--sc);color:var(--ink-pen)}
.wchip.b3,.wchip.b4{background:var(--sc);color:var(--ink-pen);box-shadow:inset 0 0 0 1.5px var(--ink-pen)}
.wchip.b5,.wchip.b6{background:var(--ink-pen);color:var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--lc);box-shadow:var(--lb,none)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-soft);font-size:10px;font-family:var(--f-ui)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(35,35,31,.2);font-size:16px}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--ink-soft);font-size:13px}
.stepper{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stepper button{width:34px;height:34px;border-radius:6px;border:1.5px solid var(--ink-pen);font-size:18px}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.switch{width:50px;height:30px;border-radius:99px;background:#d9d8cf;position:relative;flex:none;transition:background .2s;border:1.5px solid var(--ink-pen)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink-pen);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--pen-red)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.sync{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--ink-soft)}
.sync i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:#b9b7ad}
.sync.on i{background:#2f8a52} .sync.off i{background:var(--tape)}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.learner{display:flex;flex-direction:column;gap:10px}
.learner .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.learner .head b{font-size:19px}
.learner .head span{font-size:13px;color:var(--ink-soft)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:#f4f3ec;border-radius:4px;padding:8px 10px}
.mini .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.mini .l{font-size:11px;color:var(--ink-soft);letter-spacing:.04em}
/* hanko-style status stamps */
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;border:1.5px solid currentColor}
.pill.ok{color:var(--pen-red);transform:rotate(-2deg)}
.pill.warn{color:var(--pen-blue)}
.pill.late{color:#8d8b82}
.stack{display:flex;flex-direction:column;gap:14px}

/* Overlays */
#onboard{position:absolute;inset:0;z-index:20;background:var(--board);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px}
#onboard .hello{font-family:var(--f-jp);font-weight:600;font-size:60px;line-height:1.05}
#onboard p{color:var(--chalk-dim);font-size:17px;line-height:1.55;margin:0;max-width:34ch}
#onboard input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:8px;border:2px solid var(--ink-pen);background:var(--paper);color:var(--ink-pen);-webkit-user-select:text;user-select:text}
.steps{display:grid;gap:8px;font-size:15px;color:var(--chalk-dim)}
.steps div{display:flex;gap:10px;align-items:center}
.steps b{font-family:var(--f-jp);color:var(--chalk);width:72px;flex:none;font-size:17px;font-weight:600}
#toast{position:absolute;left:50%;top:68px;transform:translate(-50%,-16px) rotate(-1.5deg);opacity:0;z-index:30;background:var(--tape);color:var(--ink-pen);font-weight:700;padding:10px 18px;font-size:16px;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0) rotate(-1.5deg)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}

/* Speaking card */
.speak-box{display:flex;flex-direction:column;gap:10px}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:10px;background:var(--ink-pen);color:var(--paper);font-weight:700;font-size:18px}
.mic svg{width:24px;height:24px}
.mic.on{background:var(--pen-red);animation:pulse 1s infinite}
.dict-row{display:flex;gap:8px}
.dict{flex:1;min-width:0;font:inherit;font-family:var(--f-jp);font-size:18px;padding:11px 12px;border-radius:8px;border:2px solid var(--ink-pen);background:var(--paper);color:var(--ink-pen);-webkit-user-select:text;user-select:text}
.dict::placeholder{color:#8d8b82;font-family:var(--f-ui);font-size:13px}
.btn.sm{padding:9px 14px;font-size:15px}
.skip{align-self:center;font-size:14px;color:var(--muted);padding:4px 10px;text-decoration:underline;text-underline-offset:3px}
.yn{display:flex;gap:10px;justify-content:center;margin-top:6px}
.thinking{color:var(--ink-soft)}

/* Letter picker */
#picker{position:absolute;inset:0;z-index:22;background:var(--board);overflow-y:auto;padding:12px 16px 28px}
.pk-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--chalk-line)}
.pk-row .lbl{width:44px;height:44px;border-radius:6px;border:1.5px dashed var(--chalk-dim);color:var(--chalk-dim);font-size:12px;font-weight:700}
.pk-c{position:relative;width:46px;height:46px;border-radius:6px;background:var(--paper);color:var(--ink-pen);font-family:var(--f-jp);font-size:22px;font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.pk-c.wide{width:58px}
.pk-c.sel::after{content:"";position:absolute;inset:3px;border:2.5px solid var(--pen-red);border-radius:50%}
.pk-bar{position:sticky;bottom:0;background:var(--board);padding-block:12px 4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pk-bar span{color:var(--chalk-dim);font-size:14px;margin-left:auto}

/* Speak + Speed pages */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:8px;background:var(--paper);color:var(--ink-pen);font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.35);opacity:.7}
.seg button .jp{font-weight:600}
.seg button[aria-pressed="true"]{opacity:1;background:var(--p-k);box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 2px var(--ink-pen)}
.rowchips{display:flex;flex-wrap:wrap;gap:6px}
.rowchips button{min-width:44px;height:42px;padding:0 10px;border-radius:6px;background:var(--paper);color:var(--ink-pen);font-family:var(--f-jp);font-size:18px;font-weight:600;opacity:.55;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.rowchips button[aria-pressed="true"]{opacity:1;background:var(--p-k)}
.sp-go{width:100%;margin-top:18px;padding:15px;font-size:19px}
.sp-run{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 16px 16px;gap:12px}
.sp-top{display:flex;align-items:center;gap:12px}
.sp-score{font-family:var(--f-jp);font-size:32px;font-weight:600;min-width:48px;font-variant-numeric:tabular-nums}
.sp-time{flex:1;height:12px}
.sp-time i{transition:none}
.sp-combo{min-width:60px;text-align:right;color:var(--tape);font-weight:700;font-variant-numeric:tabular-nums}

function romaji(src){
  const s=toHira(src); let out="",dbl=false;
  for(let i=0;i<s.length;i++){
    const c=s[i],nx=s[i+1]; let r;
    if(c==="っ"){dbl=true;continue}
    if(c==="ー"){const m=out.match(/([aeiou])[^aeiou]*$/);out+=m?m[1]:"";continue}

}

const T=(en,zh)=>isZh()?zh:en;

let combo=0, recent=[], lastKind="", lastAct=0, cur=null, pending=[], sinceSpeak=3;

function dayRec(){const k=today();return S.days[k]||(S.days[k]={c:0,a:0,k:0,x:0,n:0,t:0})}
function shownStreak(){return (S.lastDay===today()||S.lastDay===dayKey(1))?S.streak:0}
function levelOf(xp){let L=1,need=100;while(xp>=need){xp-=need;L++;need=Math.round(need*1.15)}return{L,into:xp,need}}
function box(id){const e=S.srs[id];return e?e[0]:0}
function stageStats(si){const ws=STAGES[si].words;let seen=0,known=0,learned=0,mastered=0;ws.forEach(w=>{const b=box(w.id);if(b>0)seen++;if(b>=2)known++;if(b>=3)learned++;if(b>=5)mastered++});return{total:ws.length,seen,known,learned,mastered}}
// Letter stages open the next stage once every letter is known; word stages at 60% learned. Unlocks never close again.
function stageReady(i){const ss=stageStats(i);return STAGES[i].chars?ss.known>=ss.total:ss.learned/ss.total>=UNLOCK_AT}
function unlocked(){const u=[true];for(let i=1;i<STAGES.length;i++)u[i]=i<=(S.unl||0)||(u[i-1]&&stageReady(i-1));let m=0;u.forEach((x,i)=>{if(x)m=i});if(m>(S.unl||0))S.unl=m;return u}
function newLeft(){if(S.newDay!==today()){S.newDay=today();S.newCount=0;S.extraNew=0}return S.settings.newPerDay+S.extraNew-S.newCount}
function touch(){const now=Date.now();if(lastAct){const gap=now-lastAct;if(gap<120e3)dayRec().t+=Math.min(gap,45e3)/1000}lastAct=now}

function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(docRef&&sync==="on"){clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,4000)}}
function remoteBody(){
  const u=unlocked();let stage=0;u.forEach((x,i)=>{if(x)stage=i});
  const learned=WORDS.filter(w=>!w.char&&box(w.id)>=3).length, mastered=WORDS.filter(w=>!w.char&&box(w.id)>=5).length;
  const days={};for(let i=0;i<120;i++){const k=dayKey(i);if(S.days[k])days[k]=S.days[k]}
  return{name:S.name||"",xp:S.xp,level:levelOf(S.xp).L,streak:S.streak,best:S.best,lastDay:S.lastDay,seen:S.seen,answered:S.answered,correct:S.correct,bestCombo:S.bestCombo,

    kanaH:stageStats(0).known,kanaK:stageStats(2).known,kanaTotal:STAGES[0].words.length,unl:S.unl,spoken:S.spoken,spk:S.spk,speed:S.speed,spRows:S.spRows,updatedAt:S.updatedAt}
}
function pushRemote(){
  if(!docRef||sync!=="on")return;
  clearTimeout(saveTimer);
  writing=writing.then(()=>docRef.set(remoteBody())).catch(e=>{
    if(e&&e.code==="invalid_argument"){sync="blocked"}else if(e&&(e.code==="revoked"||e.code==="not_granted")){sync="off"}
    if(curView==="me")renderMe();

}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")pushRemote()});
window.addEventListener("pagehide",pushRemote);

async function connect(){

  try{[db,user,sampleFn]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")])}catch(e){}
  if(user){
    try{if(await user.isOwner())showCoachTab()}catch(e){}
  }
  if(location.hash==="#coach")showCoachTab();
  if(!db){sync="off";if(curView==="me")renderMe();return}
  let uid=null;try{uid=user?await user.id():null}catch(e){}
  myDocId=(uid||S.deviceId).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_");
  docRef=db.collection("learners").doc(myDocId);
  try{
    const snap=await docRef.get();
    if(snap.exists){const r=snap.data();if((r.updatedAt||0)>(S.updatedAt||0)){
      Object.assign(S,{name:r.name||S.name,xp:r.xp||0,streak:r.streak||0,best:r.best||0,lastDay:r.lastDay||"",seen:r.seen||0,answered:r.answered||0,correct:r.correct||0,bestCombo:r.bestCombo||0,
        days:Object.assign({},S.days,JSON.parse(JSON.stringify(r.days||{}))),srs:JSON.parse(JSON.stringify(r.srs||{})),settings:Object.assign({},S.settings,r.settings||{}),newDay:r.newDay||"",newCount:r.newCount||0,extraNew:r.extraNew||0,unl:r.unl||0,spoken:r.spoken||0,spk:JSON.parse(JSON.stringify(r.spk||{})),speed:JSON.parse(JSON.stringify(r.speed||{})),spRows:JSON.parse(JSON.stringify(r.spRows||{})),updatedAt:r.updatedAt});
      try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
      applyLang();renderHud();if(S.name)document.getElementById("onboard").hidden=true;
    }}
    sync="on";
    if(S.seen>0||S.name)pushRemote();
    if(curView==="coach")startCoach();
  }catch(e){sync=(e&&e.code==="invalid_argument")?"blocked":"off"}
  if(curView==="me")renderMe();
}

/* ---------- Sound / voice / fx ---------- */
let actx=null;
function beep(freqs,type="sine",dur=.09,vol=.08){
  if(!S.settings.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;
    freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur);t+=dur*.8})}catch(e){}
}
function say(text){try{if(!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1800)}
const fx=document.getElementById("fx"),fctx=fx.getContext("2d");let parts=[],fxOn=false;
function confetti(n=90){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const r=fx.getBoundingClientRect();fx.width=r.width*devicePixelRatio;fx.height=r.height*devicePixelRatio;fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols=["#ffcb57","#ff8a66","#2ec4b6","#8088ff","#e870d6","#45d69a"];
  for(let i=0;i<n;i++)parts.push({x:r.width/2,y:r.height*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,life:90+Math.random()*40});
  if(!fxOn){fxOn=true;requestAnimationFrame(tick)}
  function tick(){fctx.clearRect(0,0,r.width,r.height);parts=parts.filter(p=>p.life-->0);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=.2;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fctx.restore()});if(parts.length)requestAnimationFrame(tick);else{fxOn=false;fctx.clearRect(0,0,r.width,r.height)}}
}

/* ---------- Picking cards ---------- */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function nextNew(u){for(let i=0;i<STAGES.length;i++){if(!u[i])break;const w=STAGES[i].words.find(w=>!S.srs[w.id]);if(w)return w}return null}
function pickNext(){
  if(pending.length)return pending.shift();
  const now=Date.now(),u=unlocked();
  const seenWords=WORDS.filter(w=>u[w.s]&&S.srs[w.id]);
  if(S.settings.speak&&sinceSpeak>=5){
    const el=speakPool().filter(w=>!recent.includes(w.id));
    if(el.length){sinceSpeak=0;return{type:"speak",w:rnd(el.slice(0,8))}}
  }
  const due=seenWords.filter(w=>S.srs[w.id][1]<=now&&!recent.includes(w.id)).sort((a,b)=>S.srs[a.id][1]-S.srs[b.id][1]);
  const nw=newLeft()>0?nextNew(u):null;
  if(due.length&&(!nw||lastKind==="intro"||Math.random()<.5))return quizFor(due[0]);
  if(nw)return{type:"intro",w:nw};
  if(due.length)return quizFor(due[0]);
  if(nextNew(u)&&S.toldDone!==today()){S.toldDone=today();return{type:"msg",kind:"newdone"}}
  let pool=seenWords.filter(w=>!recent.includes(w.id));if(!pool.length)pool=seenWords;
  if(!pool.length){const w=nextNew(u)||WORDS[0];return{type:"intro",w}}
  pool.sort((a,b)=>box(a.id)-box(b.id)||S.srs[a.id][1]-S.srs[b.id][1]);
  return quizFor(rnd(pool.slice(0,8)),true);
}
// Words she can sound out: kana words made only of letters she knows, kanji words she has learned
function canRead(w){
  const st=STAGES[w.s];if(!st.kana)return box(w.id)>=2;
  const lk=st.k==="h"?"hc":"kc";
  return [...w.w].every(c=>"ゃゅょっぁぃぅぇぉャュョッァィゥェォー".includes(c)||box(lk+":"+c)>=2);
}
function speakPool(){
  const el=WORDS.filter(w=>!w.char&&canRead(w));
  return el.sort((a,b)=>(S.spk[a.id]||0)-(S.spk[b.id]||0)||(S.srs[b.id]?1:0)-(S.srs[a.id]?1:0));
}
function optionsFor(w,field,pool,prefer){
  const ans=w[field],opts=[ans];
  [...shuffle(prefer.slice()),...shuffle(pool.slice())].forEach(x=>{if(opts.length<4&&x[field]&&!opts.includes(x[field]))opts.push(x[field])});
  return{ans,opts:shuffle(opts)};
}
function letterPrefer(w,pool){const conf=CONFMAP[w.w]||"";return pool.filter(x=>conf.includes(x.w)||(x.row===w.row&&x.w.length>1))}
function quizFor(w,bonus=false){
  const st=STAGES[w.s],b=box(w.id);
  let types;
  if(w.char)types=b>=2?["romaji","romaji","reverse"]:["romaji"];
  else{types=st.kana?["meaning","romaji"]:["meaning","reading"];if(b>=2)types.push("reverse");if(st.kana&&!S.settings.romaji)types=types.filter(t=>t!=="romaji")}
  const qt=rnd(types);
  const field={meaning:"m",romaji:"ro",reading:"r",reverse:"w"}[qt];
  let pool=st.words.filter(x=>x.id!==w.id&&x[field]!==w[field]&&(w.char||x.m!==w.m));
  let prefer=[];
  if(w.char)prefer=letterPrefer(w,pool);
  else if(qt!=="meaning"){pool.sort((a,c)=>Math.abs(a[field].length-w[field].length)-Math.abs(c[field].length-w[field].length));pool=pool.slice(0,14)}
  const {ans,opts}=optionsFor(w,field,pool,prefer);
  return{type:"quiz",w,qt,ans,opts,bonus};
}

/* ---------- Actions ---------- */
function bumpStreakIfNeeded(){
  const d=dayRec();
  if(d.c===STREAK_MIN&&S.lastDay!==today()){
    S.streak=S.lastDay===dayKey(1)?S.streak+1:1;S.lastDay=today();S.best=Math.max(S.best,S.streak);
    toast(`連続 ${S.streak} 日! Streak kept`);beep([660,880,1100],"triangle",.1);
  }
}
function addXP(n){
  const before=levelOf(S.xp).L;S.xp+=n;dayRec().x+=n;
  const after=levelOf(S.xp).L;
  if(after>before){setTimeout(()=>{toast(`Level ${after}! レベルアップ`);confetti(120);beep([523,659,784,1046],"triangle",.12)},350)}
}
function floatXP(n,host){const f=document.createElement("div");f.className="xp-float";f.textContent="+"+n+" XP";(host||cur.el).appendChild(f);setTimeout(()=>f.remove(),1000)}
function bumpCombo(c){const cb=c.el.querySelector("[data-combo]");if(!cb)return;cb.textContent=combo>=3?"連続 ×"+combo:"";if(combo>=3){cb.classList.remove("pop");void cb.offsetWidth;cb.classList.add("pop")}}
function doReveal(){
  if(cur.done||cur.type!=="intro")return;
  touch();const w=cur.w;
  cur.el.querySelector(".reveal").innerHTML=revealHTML(w);
  if(box(w.id)<2){S.srs[w.id]=[1,Date.now()+IV[1],0];newLeft();S.newCount+=w.char?.5:1;dayRec().n++;addXP(5);floatXP(5)}
 beep([740,990],"sine",.08);
  if(S.settings.voice)say(w.r);
  cur.done=true;cur.el.classList.add("done");save();renderHud();
}
function answer(i){
  if(cur.done||cur.type!=="quiz")return;
  touch();
  const c=cur,w=c.w,pick=c.opts[i],ok=pick===c.ans,d=dayRec();
  const before=unlocked();
  const e=S.srs[w.id]||[1,0,0];
  S.answered++;d.a++;
  const btns=c.el.querySelectorAll(".opt");
  btns.forEach((b,j)=>{if(c.opts[j]===c.ans)b.classList.add("right");else if(j===i)b.classList.add("wrong");else b.classList.add("dim")});
  const fb=c.el.querySelector("[data-fb]"),info=c.el.querySelector("[data-info]");
  if(ok){
    combo++;S.correct++;d.k++;S.bestCombo=Math.max(S.bestCombo,combo);
    const nb=Math.min(e[0]+1,6);S.srs[w.id]=[nb,Date.now()+IV[nb],e[2]];
    const gain=10+Math.min(combo,10)*2;addXP(gain);floatXP(gain);
    fb.innerHTML=`<span class="praise">${rnd(PRAISE)}</span>`;
    beep([660+combo*20,990+combo*25],"triangle",.08);buzz(15);
    if(combo>0&&combo%10===0){confetti(60);toast(`${combo} in a row!`)}
  }else{
    combo=0;S.srs[w.id]=[1,Date.now()+IV[1],e[2]+1];
    fb.innerHTML=`<span class="oops">${T("Not quite. Remember this one.","不对，记住这个。")}</span>`;
    beep([220,170],"sawtooth",.12,.05);buzz([30,40,30]);
  }
  info.innerHTML=infoHTML(w);
  bumpCombo(c);
  if(S.settings.voice)say(w.r);
  const after=unlocked();after.forEach((x,si)=>{if(x&&!before[si])pending.push({type:"msg",kind:"unlock",si})});
  c.done=true;c.el.classList.add("done");save();renderHud();
}

/* ---------- Speaking ---------- */
const normJ=s=>toHira(String(s).normalize("NFKC")).replace(/[\s。、，,.!！?？「」『』・〜~]/g,"").toLowerCase();
function matchSpoken(w,text){
  const t=normJ(text);if(!t)return false;
  return [w.w,w.r,...(w.alt||[])].map(normJ).some(x=>x&&(t===x||(x.length>=2&&t.includes(x))));
}
async function speakCheck(c,texts){
  if(c.checking||c!==cur)return;
  texts=texts.map(t=>String(t||"").trim()).filter(Boolean);if(!texts.length)return;
  const fb=c.el.querySelector("[data-fb]"),info=c.el.querySelector("[data-info]"),heard=texts[0];
  if(texts.some(t=>matchSpoken(c.w,t)))return speakResult(c,true,heard);
  const odd=texts.find(t=>/[^぀-ヿ\sー。、!?！？]/.test(t));
  if(odd&&sampleFn){
    c.checking=true;fb.innerHTML=`<span class="thinking">${T("Checking…","正在检查…")}</span>`;
    try{
      const r=await sampleFn.json(`A Japanese learner was asked to say the word "${c.w.w}" (reading: ${c.w.r}) out loud. Speech-to-text heard: ${JSON.stringify(texts.slice(0,3))}. Does any of these plausibly represent the same spoken word, the same pronunciation in any spelling, kanji or digits? Small transcription noise is fine; a different word is not. Reply only with JSON: {"match": true or false, "heard_reading": "hiragana reading of what was heard"}`,{modelTier:"quick"});
      c.checking=false;return speakResult(c,!!(r&&r.match),heard,r&&r.heard_reading);
    }catch(e){c.checking=false;if(e&&e.code==="not_granted")sampleFn=null}
  }
  if(odd){
    fb.innerHTML=`${T("We heard","听到的是")} <span class="jp">${esc(heard)}</span>`;
    info.innerHTML=`${T("Is that","是")} <b>${esc(c.w.r)}</b>${T("?","吗？")}<div class="yn"><button class="btn sm" data-act="selfyes">${T("Yes","是")}</button><button class="btn sm ghost" data-act="selfno">${T("No","不是")}</button></div>`;
    return;
  }
  speakResult(c,false,heard);
}
function speakResult(c,ok,heard,hr){
  if(c!==cur)return;
  touch();const d=dayRec(),w=c.w;
  const fb=c.el.querySelector("[data-fb]"),info=c.el.querySelector("[data-info]");
  if(!c.tried){c.tried=true;d.sa=(d.sa||0)+1}
  if(ok){
    if(!c.scored){c.scored=true;combo++;S.bestCombo=Math.max(S.bestCombo,combo);S.spoken=(S.spoken||0)+1;d.sp=(d.sp||0)+1;S.spk[w.id]=(S.spk[w.id]||0)+1;const g=15+Math.min(combo,10)*2;addXP(g);floatXP(g)}
    fb.innerHTML=`<span class="praise">${rnd(["じょうず!","発音いいね!","すごい!","ばっちり!"])}</span>`;
    beep([660,880,1180],"triangle",.08);buzz(15);
  }else{
    combo=0;
    fb.innerHTML=`<span class="oops">${T("We heard","听到的是")} “${esc(heard)}”${hr&&hr!==heard?" ("+esc(hr)+")":""}${T(". Listen, then try again.","。听一下，再试一次。")}</span>`;
    beep([220,170],"sawtooth",.12,.05);say(w.r);
  }
  info.innerHTML=infoHTML(w);bumpCombo(c);
  c.done=true;c.el.classList.add("done");save();renderHud();
}
function blockSR(c){
  srBlocked=true;const m=c.el.querySelector('[data-act="mic"]');if(m)m.hidden=true;
  const inp=c.el.querySelector("[data-dict]");inp.placeholder=T("Tap, then keyboard mic","点这里，用键盘话筒");
  c.el.querySelector("[data-fb]").innerHTML=`<span class="thinking">${T("Use the mic on your Japanese keyboard instead.","请改用日语键盘上的话筒。")}</span>`;
  inp.focus();
}
function listen(c,btn){
  if(srBlocked||btn.classList.contains("on"))return;
  let rec;try{rec=new SR()}catch(e){blockSR(c);return}
  rec.lang="ja-JP";rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
  const lbl=btn.querySelector("span");btn.classList.add("on");lbl.textContent=T("Listening…","正在听…");
  let got=false;
  rec.onresult=e=>{got=true;const alts=[];for(const r of e.results)for(const a of r)alts.push(a.transcript);speakCheck(c,alts)};
  rec.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error))blockSR(c)};
  rec.onend=()=>{btn.classList.remove("on");lbl.textContent=T("Tap and say it","点一下，然后说");if(!got&&!srBlocked&&c===cur&&!c.done)c.el.querySelector("[data-fb]").innerHTML=`<span class="thinking">${T("Didn't catch that. Tap and try again.","没听清，再点一下试试。")}</span>`};
  try{rec.start()}catch(e){blockSR(c)}
}

function finishCard(c){
  if(c.type==="msg")return;
  const d=dayRec();S.seen++;d.c++;sinceSpeak++;
  recent.push(c.w.id);if(recent.length>4)recent.shift();
  lastKind=c.type;
  bumpStreakIfNeeded();
  if(d.c===GOAL){pending.unshift({type:"msg",kind:"goal"});confetti(140);beep([523,659,784,1046,1318],"triangle",.11)}
  save();renderHud();
}

/* ---------- Feed + swipe ---------- */
const feed=document.getElementById("feed");
function startFeed(){feed.innerHTML="";cur=build(pickNext());feed.appendChild(cur.el)}
let busy=false;
function advance(){
  if(busy)return;
  if(!cur.done){if(cur.type==="intro")doReveal();else nudge();return}
  busy=true;finishCard(cur);
  const old=cur,next=build(pickNext());
  next.el.style.transition="none";next.el.style.transform="translateY(110%)";feed.appendChild(next.el);void next.el.offsetWidth;
  next.el.style.transition="";old.el.style.transition="";
  old.el.style.transform="translateY(-110%)";next.el.style.transform="translateY(0)";
  cur=next;beep([520],"sine",.05,.03);
  setTimeout(()=>{old.el.remove();busy=false},400);
}
function nudge(){cur.el.classList.remove("nudge");void cur.el.offsetWidth;cur.el.classList.add("nudge")}
feed.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||!cur)return;
  const a=b.dataset.act;
  if(a==="reveal")doReveal();
  else if(a==="say")say(cur.w.r);
  else if(a==="opt")answer(+b.dataset.i);
  else if(a==="more"){newLeft();S.extraNew+=5;save();toast("5 more coming");advance()}
  else if(a==="picker")openPicker(+b.dataset.si);
  else if(a==="mic")listen(cur,b);
  else if(a==="check")speakCheck(cur,[cur.el.querySelector("[data-dict]").value]);
  else if(a==="selfyes")speakResult(cur,true,cur.w.r);
  else if(a==="selfno")speakResult(cur,false,cur.el.querySelector("[data-dict]").value||"?");
  else if(a==="skip"){cur.done=true;cur.el.classList.add("done");advance()}
});
let dictTimer=0;
feed.addEventListener("input",e=>{if(!e.target.matches("[data-dict]"))return;clearTimeout(dictTimer);const v=e.target.value.trim();if(v)dictTimer=setTimeout(()=>{if(e.target.value.trim()===v)speakCheck(cur,[v])},1300)});
feed.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("[data-dict]")){e.preventDefault();e.target.blur();speakCheck(cur,[e.target.value])}});
feed.addEventListener("click",e=>{if(e.target.closest(".hint"))advance()});
let drag=null;
feed.addEventListener("pointerdown",e=>{if(!cur||busy)return;drag={y:e.clientY,x:e.clientX,id:e.pointerId,dy:0,on:false}});
feed.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dy=e.clientY-drag.y,dx=e.clientX-drag.x;
  if(!drag.on&&Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){drag.on=true;try{feed.setPointerCapture(drag.id)}catch(_){}cur.el.style.transition="none"}
  if(drag.on){drag.dy=dy;const t=dy<0?dy*(cur.done?1:.25):dy*.15;cur.el.style.transform=`translateY(${t}px)`}
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;if(!d.on)return;
  cur.el.style.transition="";
  if(d.dy<-70&&cur.done)advance();
  else{cur.el.style.transform="translateY(0)";if(d.dy<-70){if(cur.type==="intro")doReveal();else setTimeout(nudge,50)}}
}
feed.addEventListener("pointerup",endDrag);feed.addEventListener("pointercancel",endDrag);
let wheelLock=0;
feed.addEventListener("wheel",e=>{e.preventDefault();if(e.deltaY>25&&Date.now()>wheelLock){wheelLock=Date.now()+600;advance()}},{passive:false});
document.addEventListener("keydown",e=>{
  if(curView!=="feed"||e.target.tagName==="INPUT")return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key===" "||e.key==="Enter"){e.preventDefault();advance()}
  if(cur&&cur.type==="quiz"&&!cur.done&&/^[1-4]$/.test(e.key))answer(+e.key-1);
});

/* ---------- HUD ---------- */
function renderHud(){
  const s=shownStreak();document.getElementById("streak-n").textContent=s;document.getElementById("streak").classList.toggle("cold",S.lastDay!==today());
  const lv=levelOf(S.xp);document.getElementById("lvl-n").textContent="Lv "+lv.L;document.getElementById("xp-t").textContent=lv.into+" / "+lv.need+" XP";
  document.getElementById("xp-bar").style.width=(lv.into/lv.need*100)+"%";
  const c=(S.days[today()]||{c:0}).c;document.getElementById("goal-n").textContent=c;
  document.getElementById("goal-ring").style.strokeDashoffset=106.8*(1-Math.min(c/GOAL,1));
}

/* ---------- Charts ---------- */
function bars(days,n=14,h=90){
  const W=320,pad=18,bw=(W-8)/n;let max=GOAL;const vals=[];
  for(let i=n-1;i>=0;i--){const k=dayKey(i);const v=(days&&days[k]&&days[k].c)||0;vals.push({k,v});max=Math.max(max,v)}
  const gy=h-pad-(GOAL/max)*(h-pad-8);
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Cards per day, last ${n} days"><line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--pen-red)" stroke-dasharray="3 4" stroke-width="1" opacity=".6"/><text x="${W-2}" y="${gy-4}" text-anchor="end">goal ${GOAL}</text>`;
  vals.forEach((d,i)=>{const bh=Math.max(d.v?3:1.5,(d.v/max)*(h-pad-8));const x=4+i*bw+bw*.18,y=h-pad-bh;
    s+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${bh}" rx="3" fill="${d.v>=GOAL?"var(--pen-red)":d.v?"var(--pen-blue)":"var(--rule)"}"><title>${d.k}: ${d.v} cards</title></rect>`;
    if(i%2===(n-1)%2)s+=`<text x="${x+bw*.32}" y="${h-4}" text-anchor="middle">${+d.k.slice(8)}</text>`});
  return s+"</svg>";
}
const fmtMin=sec=>{const m=Math.round(sec/60);return m<60?m+"m":Math.floor(m/60)+"h "+(m%60)+"m"};

/* ---------- Words view ---------- */
let openStage=-1;
function renderWords(){

  const daysLeft=Math.max(0,Math.ceil((JLPT-new Date())/864e5));
  let h=`<h2>単語 decks</h2><p class="sub">${learned} of ${vocab.length} starter words learned. JLPT N3 is on July 4, 2027 (expected), ${daysLeft} days away. N3 covers about 3,700 words in total, so this deck is the first step.</p><div class="panel">`;
  STAGES.forEach((st,i)=>{
    const ss=stageStats(i),locked=!u[i],done=st.chars?ss.known:ss.learned;
    let lockMsg="";
    if(locked&&i>0){const p=STAGES[i-1],ps=stageStats(i-1);
      lockMsg=p.chars?`Know all ${ps.total} ${p.name} letters to unlock (${ps.total-ps.known} to go)`:`Learn ${Math.max(0,Math.ceil(ps.total*UNLOCK_AT)-ps.learned)} more ${p.name} words to unlock`}
    h+=`<div class="stage-row${locked?" locked":""}" style="--sc:${st.color}"><div class="badge">${st.badge}</div>
      <div class="nm"><span class="jp">${st.name}</span><small>${st.sub}</small></div><div class="ct">${done}/${ss.total}</div>
      <div class="bar"><i style="width:${done/ss.total*100}%"></i></div>
      ${locked?`<div class="sub" style="grid-column:2/4;margin:0;font-size:13px">${lockMsg}</div>`:`<div style="grid-column:2/4;display:flex;gap:16px;flex-wrap:wrap"><button class="more" data-st="${i}">${openStage===i?"Hide":"Show"} ${st.chars?"letters":"words"}</button>${st.chars?`<button class="more" data-pk="${i}">I already know some</button>`:""}</div>`}
      ${openStage===i?`<div class="wgrid">${st.words.map(w=>`<span class="wchip b${box(w.id)}" title="${esc(w.char?w.ro:w.r+" · "+w.m)}">${esc(w.w)}</span>`).join("")}</div>`:""}
    </div>`;
  });
  h+=`</div><div class="legend"><span style="--lc:#f1f0e8">not seen</span><span style="--lc:var(--p-n5)">learning</span><span style="--lc:var(--p-n5);--lb:inset 0 0 0 1.5px var(--ink-pen)">learned</span><span style="--lc:var(--ink-pen)">mastered</span></div>`;
  h+=`<p class="sub" style="margin-top:14px">Letters come first: every hiragana letter opens hiragana words, and every katakana letter opens katakana words. A word counts as learned after you answer it right on a later day, and each word stage opens the next at ${Math.round(UNLOCK_AT*100)}% learned.</p>`;

document.getElementById("pk-save").onclick=()=>{

  save();renderHud();document.getElementById("picker").hidden=true;

document.getElementById("pk-none").onclick=()=>{document.getElementById("picker").hidden=true};

/* ---------- Coach view ---------- */
let coachUnsub=null,coachDocs=[];
function showCoachTab(){document.getElementById("tab-coach").hidden=false}
function relTime(ms){if(!ms)return"never";const m=Math.round((Date.now()-ms)/60000);if(m<2)return"just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" h ago";return Math.round(h/24)+" days ago"}
function renderCoach(){
  const v=document.getElementById("v-coach");
  let h=`<h2>Coach view</h2><p class="sub">Everyone training on this page, newest activity first. Updates live while they swipe.</p>`;
  if(!db){v.innerHTML=h+`<div class="panel sub" style="margin:0">Live progress isn't available in this view. Open the page from claude.ai while signed in.</div>`;return}
  if(!coachDocs.length){v.innerHTML=h+`<div class="panel sub" style="margin:0">No one has trained yet. Share this page with your learner; their progress appears here after the first card.</div>`;return}
  h+=`<div class="stack">`;
  coachDocs.forEach(r=>{
    const td=(r.days||{})[today()]||{c:0,t:0,a:0,k:0};let wk=0,wt=0;for(let i=0;i<7;i++){const x=(r.days||{})[dayKey(i)];if(x){wk+=x.c;wt+=x.t}}
    const st=(r.lastDay===today()||r.lastDay===dayKey(1))?r.streak:0;
    const acc=r.answered?Math.round(r.correct/r.answered*100):0;
    const status=td.c>=GOAL?`<span class="pill ok">Goal done today</span>`:td.c>0?`<span class="pill warn">${td.c}/${GOAL} today</span>`:`<span class="pill late">Not yet today</span>`;
    h+=`<div class="panel learner"><div class="head"><b>${esc(r.name||"Unnamed learner")}${r._me?' <span style="font-size:13px;color:var(--muted)">(you)</span>':""}</b><span>active ${relTime(r.updatedAt)}</span></div>
      <div>${status} <span class="pill" style="background:var(--ink-3)">${esc(r.stageName||"ひらがな")}</span></div>
      <div class="minis">
        <div class="mini"><div class="v">${st}</div><div class="l">Streak</div></div>
        <div class="mini"><div class="v">${wk}</div><div class="l">Cards / 7d</div></div>
        <div class="mini"><div class="v">${fmtMin(wt)}</div><div class="l">Time / 7d</div></div>
        <div class="mini"><div class="v">${acc}%</div><div class="l">Accuracy</div></div>
        <div class="mini"><div class="v">${r.learned||0}</div><div class="l">Learned</div></div>
        <div class="mini"><div class="v">${r.level||1}</div><div class="l">Level</div></div>
        <div class="mini"><div class="v">${r.kanaH||0}<small style="font-size:12px;color:var(--muted)">/${r.kanaTotal||102}</small></div><div class="l">ひらがな</div></div>
        <div class="mini"><div class="v">${r.kanaK||0}<small style="font-size:12px;color:var(--muted)">/${r.kanaTotal||102}</small></div><div class="l">カタカナ</div></div>
        <div class="mini"><div class="v">${(r.speed&&r.speed.kc&&r.speed.kc.best)||0}</div><div class="l">Kata speed</div></div>
      </div>
      <div class="chart">${bars(r.days)}</div>
      <div class="sub" style="margin:0">All time: ${r.seen||0} cards · ${r.spoken||0} words said right aloud · best streak ${r.best||0} · best combo ${r.bestCombo||0}</div></div>`;
  });
  v.innerHTML=h+`</div>`;
}
function startCoach(){
  if(!db||coachUnsub)return;
  coachUnsub=db.collection("learners").orderBy("updatedAt","desc").limit(50).onSnapshot(snap=>{
    coachDocs=snap.docs.map(d=>Object.assign({_me:d.id===myDocId},d.data()));if(curView==="coach")renderCoach();
  },()=>{coachUnsub=null});
}

/* ---------- Speed drill ---------- */
const SPEED_MODES={kc:{name:"カタカナ",sub:"letters",stage:2},hc:{name:"ひらがな",sub:"letters",stage:0},kw:{name:"カタカナ",sub:"words",stage:3}};
const RUN_MS=60000;
let spMode="kc",run=null;
function spRowsFor(mode){
  const st=STAGES[SPEED_MODES[mode].stage];
  if(S.spRows[mode]&&S.spRows[mode].length)return S.spRows[mode];
  const seen=st.rows.filter(r=>r.cs.some(c=>S.srs[st.k+":"+c])).map(r=>r.lbl);
  return seen.length?seen:st.rows.slice(0,2).map(r=>r.lbl);
}
function spPool(mode){
  const st=STAGES[SPEED_MODES[mode].stage];
  if(mode==="kw"){const seen=st.words.filter(w=>S.srs[w.id]);return seen.length>=8?seen:st.words.filter(w=>w.w.length<=4).slice(0,24)}
  const rows=spRowsFor(mode);return st.words.filter(w=>rows.includes(w.row));
}
function renderSpeed(){
  const v=document.getElementById("v-speed");
  if(run)return;
  const m=SPEED_MODES[spMode],st=STAGES[m.stage],rec=S.speed[spMode]||{best:0,runs:[]},pool=spPool(spMode);
  let h=`<h2>Speed reading</h2><p class="sub">Read as many as you can in 60 seconds. Wrong answers don't end the run, they just show you the right one. Start with two rows, and add a row once you score 20 or more.</p>
  <div class="seg">${Object.entries(SPEED_MODES).map(([k,x])=>`<button data-mode="${k}" aria-pressed="${k===spMode}"><span class="jp">${x.name}</span> ${x.sub}</button>`).join("")}</div>`;
  if(spMode!=="kw"){
    const rows=spRowsFor(spMode);
    h+=`<h3>Rows</h3><div class="rowchips">${st.rows.map(r=>`<button data-row="${esc(r.lbl)}" aria-pressed="${rows.includes(r.lbl)}">${esc(r.lbl)}</button>`).join("")}</div>`;
  }else h+=`<p class="sub" style="margin-top:14px">${pool.length} katakana words: ${S.srs[st.words[0].id]?"the ones you've met so far":"short starter words"}.</p>`;
  h+=`<button class="btn sp-go" id="sp-go">Start · ${pool.length} to read</button>
  <h3>Best ${esc(m.name)} ${m.sub}</h3><div class="panel"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:34px;font-weight:700;font-variant-numeric:tabular-nums">${rec.best}</span><span class="sub" style="margin:0">correct in 60 seconds</span></div>
  ${rec.runs&&rec.runs.length?`<div class="runs" style="margin-top:8px">${rec.runs.slice(-5).reverse().map(r=>`<div><span>${esc(r.d)}</span><span>${r.s} right · ${r.acc}% · ${r.rows||""}</span></div>`).join("")}</div>`:`<p class="sub" style="margin:6px 0 0">No runs yet.</p>`}</div>`;
  v.innerHTML=h;
  v.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{spMode=b.dataset.mode;renderSpeed()});
  v.querySelectorAll("[data-row]").forEach(b=>b.onclick=()=>{let rows=spRowsFor(spMode).slice();const r=b.dataset.row;rows=rows.includes(r)?rows.filter(x=>x!==r):[...rows,r];if(!rows.length)return;S.spRows[spMode]=rows;save();renderSpeed()});
  v.querySelector("#sp-go").onclick=startRun;
}
function startRun(){
  const pool=spPool(spMode);
  if(pool.length<4){toast("Pick at least two rows");return}
  run={mode:spMode,pool,end:Date.now()+RUN_MS,score:0,n:0,combo:0,best:0,stats:{},item:null,lock:false,raf:0};
  const v=document.getElementById("v-speed");v.scrollTop=0;
  v.innerHTML=`<div class="sp-run"><div class="sp-top"><span class="sp-score" id="sp-score">0</span><div class="bar sp-time"><i id="sp-bar" style="width:100%"></i></div><span class="sp-combo" id="sp-combo"></span></div>
    <div class="sp-stage" id="sp-stage"><div class="sp-char" id="sp-char"></div></div>
    <div class="opts sp-opts" id="sp-opts"></div><button class="skip" id="sp-stop">Stop</button></div>`;
  v.querySelector("#sp-opts").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)runAnswer(+b.dataset.i)});
  v.querySelector("#sp-stop").onclick=()=>{stopRun();renderSpeed()};
  beep([523,659,784],"triangle",.08);nextItem();tickRun();
}
function nextItem(){
  let w;do{w=rnd(run.pool)}while(run.pool.length>1&&run.item&&w.id===run.item.id);
  const st=STAGES[w.s],all=st.words.filter(x=>x.id!==w.id);
  const prefer=w.char?letterPrefer(w,run.pool.filter(x=>x.id!==w.id)).concat(letterPrefer(w,all)):[];
  const pool=run.pool.filter(x=>x.id!==w.id);
  const o=optionsFor(w,"ro",pool.length>=3?pool:all,prefer);
  run.item=w;run.ans=o.ans;run.opts=o.opts;run.shown=Date.now();run.lock=false;
  const ch=document.getElementById("sp-char");ch.textContent=w.w;ch.style.setProperty("--len",w.w.length);
  document.getElementById("sp-stage").className="sp-stage";
  document.getElementById("sp-opts").innerHTML=run.opts.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x)}</button>`).join("");
}
function runAnswer(i){
  if(!run||run.lock)return;run.lock=true;
  const w=run.item,ok=run.opts[i]===run.ans,dt=Date.now()-run.shown;
  const s=run.stats[w.w]||(run.stats[w.w]={t:0,n:0,miss:0,ro:w.ro});s.t+=dt;s.n++;run.n++;
  const btns=document.querySelectorAll("#sp-opts .opt"),stage=document.getElementById("sp-stage");
  if(ok){run.score++;run.combo++;run.best=Math.max(run.best,run.combo);stage.classList.add("ok");btns[i].classList.add("right");beep([600+Math.min(run.combo,20)*30],"triangle",.06,.06);buzz(8)}
  else{s.miss++;run.combo=0;stage.classList.add("no");btns.forEach((b,j)=>{if(run.opts[j]===run.ans)b.classList.add("right");else if(j===i)b.classList.add("wrong")});beep([200],"sawtooth",.08,.04)}
  document.getElementById("sp-score").textContent=run.score;
  document.getElementById("sp-combo").textContent=run.combo>=3?"×"+run.combo:"";
  setTimeout(()=>{if(run&&Date.now()<run.end)nextItem()},ok?140:800);
}
function tickRun(){
  if(!run)return;const left=run.end-Date.now();
  document.getElementById("sp-bar").style.width=Math.max(0,left/RUN_MS*100)+"%";
  if(left<=0)return finishRun();
  run.raf=requestAnimationFrame(tickRun);
}
function stopRun(){if(run){cancelAnimationFrame(run.raf);run=null}}
function finishRun(){
  const r=run;stopRun();
  const acc=r.n?Math.round(r.score/r.n*100):0,m=SPEED_MODES[r.mode];
  const rec=S.speed[r.mode]||(S.speed[r.mode]={best:0,runs:[]});
  const isBest=r.score>rec.best&&r.score>0;rec.best=Math.max(rec.best,r.score);
  rec.runs=(rec.runs||[]).concat([{d:today(),s:r.score,acc,rows:r.mode==="kw"?"":spRowsFor(r.mode).length+" rows"}]).slice(-20);
  const d=dayRec();d.sr=(d.sr||0)+1;d.t+=RUN_MS/1000;
  if(r.score)addXP(r.score*2);
  save();renderHud();
  const slow=Object.entries(r.stats).map(([k,s])=>({k,ro:s.ro,avg:s.t/s.n,miss:s.miss})).sort((a,b)=>b.miss-a.miss||b.avg-a.avg).slice(0,6);
  const avg=r.n?(Object.values(r.stats).reduce((a,s)=>a+s.t,0)/r.n/1000).toFixed(1):"0";
  const v=document.getElementById("v-speed");
  v.innerHTML=`<div class="result"><div class="sub" style="margin:0">${esc(m.name)} ${m.sub} · 60 seconds</div><div class="big">${r.score}</div><div>right, ${acc}% accuracy, ${avg}s each</div>
    ${isBest?`<div class="nb">新記録! New best</div>`:`<div class="sub" style="margin:0">Best: ${rec.best}</div>`}</div>
    ${slow.length?`<h3>Practice these</h3><div class="slow">${slow.map(x=>`<span>${esc(x.k)}<small>${esc(x.ro)}${x.miss?" · missed":""}</small></span>`).join("")}</div>`:""}
    <div class="row-btns" style="justify-content:center;margin-top:22px"><button class="btn" id="sp-again">Go again</button><button class="btn ghost" id="sp-back">Change rows</button></div>`;
  v.querySelector("#sp-again").onclick=startRun;v.querySelector("#sp-back").onclick=renderSpeed;
  if(isBest){confetti(120);beep([523,659,784,1046],"triangle",.12)}else beep([523,659],"triangle",.1);
}
document.addEventListener("keydown",e=>{if(curView==="speed"&&run&&/^[1-4]$/.test(e.key))runAnswer(+e.key-1)});

/* ---------- Speak page ---------- */
function renderSpeak(){
  const v=document.getElementById("v-speak"),pool=speakPool(),d=S.days[today()]||{};
  let h=`<h2>話す · Say it out loud</h2><p class="sub">A round is 5 cards. Each one shows a word you can already read. Say it, and the app checks what it heard. Speaking cards also turn up every few cards in the Swipe feed.</p>
  <div class="panel"><ol class="howto">
    ${srBlocked?`<li><span>Tap the box on the card, switch to the <b>日本語 keyboard</b> and tap its <b>mic</b>. (No mic? Settings › General › Keyboard › Enable Dictation.)</span></li>
    <li><span>Say the word. The card checks it by itself when you stop talking.</span></li>`:`<li><span>Tap <b>Tap and say it</b>, then say the word.</span></li>
    <li><span>If that button doesn't work, tap the box under it and press the <b>mic on your Japanese keyboard</b>. The card checks it when you stop talking.</span></li>`}
    <li><span>Wrong? The card plays the right pronunciation. Listen, then try again.</span></li>
  </ol></div>`;
  if(pool.length)h+=`<button class="btn sp-go" id="spk-go">Start a speaking round · 5 words</button><p class="sub" style="margin-top:10px">${pool.length} words you can read right now.</p>`;
  else h+=`<div class="panel" style="margin-top:14px"><p class="sub" style="margin:0">Speaking words appear once you know a few hiragana letters. Mark the ones you know, or start with easy starter words.</p><div class="row-btns"><button class="btn" id="spk-pick">Pick known letters</button><button class="btn ghost" id="spk-starter">Use starter words</button></div></div>`;
  h+=`<h3>Speaking</h3><div class="tiles"><div class="tile"><div class="v">${d.sp||0}</div><div class="l">Said right today</div></div><div class="tile"><div class="v">${S.spoken||0}</div><div class="l">Said right, all time</div></div></div>`;
  v.innerHTML=h;
  const go=v.querySelector("#spk-go");if(go)go.onclick=()=>startSpeakRound(shuffle(pool.slice(0,15)));
  const pk=v.querySelector("#spk-pick");if(pk)pk.onclick=()=>openPicker(0);
  const st=v.querySelector("#spk-starter");if(st)st.onclick=()=>startSpeakRound(shuffle(STAGES[1].words.filter(w=>w.w.length<=3).slice(0,12)));
}
function startSpeakRound(words){pending=words.slice(0,5).map(w=>({type:"speak",w}));sinceSpeak=0;show("feed");startFeed()}

/* ---------- Tabs ---------- */
let curView="feed";
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)});
function show(v){
  curView=v;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.hidden=s.id!=="v-"+v);
  if(run&&v!=="speed")stopRun();if(v==="speed")renderSpeed();if(v==="speak")renderSpeak();if(v==="words")renderWords();if(v==="me")renderMe();if(v==="coach"){startCoach();renderCoach()}
}

/* ---------- Onboarding ---------- */
function renderOnboard(){
  const set=(id,t)=>{document.getElementById(id).textContent=t};
  set("ob-p",T("One word per card. Read it, then swipe up for the next one, like a video feed. Every day you train keeps your streak alive.","一张卡片一个词。读一读，然后上滑看下一张，就像刷短视频。每天练习就能保持连续打卡。"));
  set("ob-s1",T("letters, then everyday words","先学字母，再学常用词"));set("ob-s2",T("borrowed words","外来词"));
  set("ob-l",T("What should we call you?","怎么称呼你？"));set("start-btn",T("Start swiping","开始"));
  document.getElementById("name-in").placeholder=T("Your name","你的名字");
  document.querySelectorAll("#ob-lang [data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.settings.lang));
}
document.getElementById("ob-lang").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;S.settings.lang=b.dataset.lang;applyLang();renderOnboard();startFeed()});
renderOnboard();
document.getElementById("start-btn").onclick=()=>{
  const n=document.getElementById("name-in").value.trim();S.name=n||S.name||"";save();pushRemote();
  document.getElementById("onboard").hidden=true;beep([523,784],"triangle",.1);if(curView==="me")renderMe();
  if(!STAGES[0].words.some(w=>S.srs[w.id]))openPicker(0);
};
document.getElementById("name-in").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("start-btn").click()});

/* ---------- Boot ---------- */
if(!S.name)document.getElementById("onboard").hidden=false;
renderHud();startFeed();
if(location.hash==="#coach")show("coach");
// Learners from the first version already have a name: offer the letter picker once
if(S.name&&!S.pkAsked&&!STAGES[0].words.some(w=>S.srs[w.id])){S.pkAsked=1;save();openPicker(0)}
connect();
</script>
