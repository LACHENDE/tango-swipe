<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1B1035">
<title>Tango Swipe · Live Raid</title>
<style>
:root{
  --night:#1B1035; --night2:#241A4F; --panel:#2A1B55; --line:#4A3A85;
  --gold:#F2C14E; --gold-lt:#FFE7A3; --gold-dk:#B8862B;
  --teal:#2EE6D6; --magenta:#FF4FA3; --cream:#F6F1E7; --soft:#CFC6E8; --muted:#A99BD0;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","PingFang SC","Microsoft YaHei","Noto Sans CJK JP",system-ui,sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Songti SC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:var(--font);overscroll-behavior:none}
body{display:flex;justify-content:center}
button,input{font-family:inherit;color:inherit}
#app{width:100%;max-width:480px;height:100%;min-height:560px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#3A2878 0%,var(--night) 62%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
[hidden]{display:none!important}
.pad{padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom));gap:12px;overflow-y:auto}
.eyebrow{margin:0;font-size:13px;font-weight:800;letter-spacing:3px;color:var(--teal)}
.title{margin:0;font-family:var(--serif);font-weight:800;font-size:40px;line-height:1.05;color:var(--gold);background:linear-gradient(180deg,#FFF1C4 0%,var(--gold) 55%,#C9922F 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hero{width:92px;height:auto;filter:drop-shadow(0 0 18px rgba(46,230,214,.35))}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:1px}
input[type=text],#nameIn,#codeIn{width:100%;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--night2);outline:none}
input:focus{border-color:var(--gold)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--night2);font-size:15px;font-weight:800;color:var(--soft);cursor:pointer}
.seg button.on{border-color:var(--gold);color:var(--night);background:linear-gradient(180deg,var(--gold-lt),var(--gold))}
.hint{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.btn{display:block;width:100%;padding:14px 12px;border-radius:16px;border:2px solid var(--gold);font-size:18px;font-weight:800;cursor:pointer;background:var(--panel);color:var(--gold-lt);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px rgba(255,231,163,.3),0 0 22px rgba(242,193,78,.18)}
.btn.gold{color:var(--night);background:linear-gradient(180deg,var(--gold-lt),var(--gold));box-shadow:0 0 24px rgba(242,193,78,.4)}
.btn.teal{border-color:var(--teal);color:var(--night);background:var(--teal);box-shadow:0 0 20px rgba(46,230,214,.35)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line);color:var(--soft)}
.btn.small{padding:10px;font-size:15px}
.btn:disabled{opacity:.45}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:800}
.joinrow .btn{width:auto;min-width:96px}
.net{margin:0;font-size:13px;color:var(--muted);text-align:center}
.link{background:none;border:none;color:var(--teal);font-weight:800;font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
.code{font-family:var(--serif);font-size:64px;font-weight:800;letter-spacing:12px;text-align:center;color:var(--gold-lt);text-shadow:0 0 24px rgba(242,193,78,.45)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-weight:800}
.plist .dot{width:12px;height:12px;border-radius:50%}
.plist .tag{margin-left:auto;font-size:12px;color:var(--muted);font-weight:800}
.spacer{flex:1}
/* raid */
#raid{background:#120C33;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#arena{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 14px 8px;display:flex;flex-direction:column;gap:6px;z-index:2;background:linear-gradient(180deg,rgba(10,6,30,.6),rgba(10,6,30,0))}
.hud .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mname{font-weight:800;font-size:20px;color:#F6F1E7;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.pill{font-weight:800;font-size:17px;color:#F6F1E7;background:rgba(10,6,30,.72);border:1px solid rgba(169,155,208,.4);border-radius:999px;padding:2px 12px;font-variant-numeric:tabular-nums}
.hpbar{position:relative;height:12px;border-radius:8px;border:1.5px solid var(--gold);background:rgba(10,6,30,.78);padding:1.5px;overflow:hidden}
#hpFill{height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,var(--magenta),#FF8A5C);transition:width .2s}
#hpText{display:none}
#hearts{font-size:16px;color:var(--magenta);letter-spacing:2px;min-height:20px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.strike{display:flex;gap:4px;align-items:center;font-size:11px;font-weight:800;color:var(--soft);text-shadow:0 1px 3px #000}
.strike i{width:9px;height:9px;border-radius:3px;background:rgba(169,155,208,.35);display:inline-block}
.strike i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.toast{position:absolute;left:50%;top:100px;transform:translateX(-50%);z-index:3;padding:6px 12px;border-radius:12px;background:rgba(27,16,53,.88);border:1px solid var(--line);font-size:13px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.ctl{position:absolute;left:0;right:0;bottom:0;top:62%;z-index:2;display:flex;flex-direction:column;gap:8px;padding:0 12px max(10px,env(safe-area-inset-bottom));touch-action:none}
.qbar{display:flex;align-items:flex-start;justify-content:center;gap:6px}
#qWord{font-weight:800;font-size:44px;line-height:1.05;color:#F6F1E7;text-shadow:0 2px 0 #1B1035,0 0 18px rgba(0,0,0,.8)}
.qtag{margin-top:4px;font-size:13px;font-weight:800;color:#F6F1E7;background:#2F5BBF;border:1px solid #6FA0FF;border-radius:7px;padding:0 6px}
.qtag.t1{background:#5B6680;border-color:#A7B4C8}
.qtag.t3{background:#6A3FB0;border-color:#B46BFF}
#qSub{display:block;text-align:center;font-size:14px;font-weight:800;color:var(--soft);min-height:18px;text-shadow:0 1px 4px #000}
.qbar.good #qWord{color:var(--teal)}
.qbar.bad #qWord{color:var(--magenta)}
.cross{display:grid;grid-template-columns:1fr 34px 1fr;grid-template-rows:auto auto auto;gap:6px;align-items:center}
.ans{border-radius:12px;border:1.5px solid rgba(169,155,208,.6);background:rgba(18,12,46,.84);font-size:17px;font-weight:800;line-height:1.15;padding:7px 12px;color:#F6F1E7;cursor:pointer;touch-action:none;max-width:100%;overflow-wrap:anywhere;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.ans.u{grid-column:1 / 4;grid-row:1;justify-self:center}
.ans.l{grid-column:1;grid-row:2;justify-self:end}
.ans.r{grid-column:3;grid-row:2;justify-self:start}
.ans.d{grid-column:1 / 4;grid-row:3;justify-self:center}
.ans.long{font-size:14px}
.ans.good{background:var(--teal);border-color:var(--teal);color:var(--night)}
.ans.bad{background:var(--magenta);border-color:var(--magenta);color:var(--night)}
.ans:disabled{opacity:.5}
.mid{grid-column:2;grid-row:2;justify-self:center;width:10px;height:10px;transform:rotate(45deg);border:1.5px solid var(--gold)}
.thumbs{margin-top:auto;display:flex;align-items:center;gap:10px}
.stick{width:116px;height:116px;flex:none;border-radius:50%;border:2px solid rgba(46,230,214,.55);background:radial-gradient(circle,rgba(46,230,214,.14),rgba(46,230,214,.03));position:relative;touch-action:none;display:flex;align-items:center;justify-content:center}
.knob{width:54px;height:54px;border-radius:50%;background:linear-gradient(180deg,#C9D2EA,#8F9BC2);box-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none;transition:transform .05s}
.skill{flex:1;min-width:0;padding:10px 6px;border-radius:14px;border:1.5px solid var(--line);background:rgba(18,12,46,.84);color:var(--muted);font-weight:800;font-size:14px;cursor:pointer}
.skill.ready{border-color:var(--gold);color:var(--gold-lt);background:rgba(92,66,18,.88);box-shadow:0 0 18px rgba(242,193,78,.5);animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 30px rgba(242,193,78,.85)}}
.flickpad{width:96px;height:96px;flex:none;position:relative;border-radius:50%;background:radial-gradient(circle,rgba(169,155,208,.14),rgba(169,155,208,0) 70%)}
.flickpad span{position:absolute;color:rgba(207,198,232,.75);font-size:16px;font-weight:800;transform:translate(-50%,-50%)}
.flickpad .pu{left:50%;top:14%}.flickpad .pl{left:14%;top:50%}.flickpad .pr{left:86%;top:50%}.flickpad .pd{left:50%;top:86%}
.flickpad .pc{left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:rgba(207,198,232,.75)}
.flickpad.hit{background:radial-gradient(circle,rgba(242,193,78,.35),rgba(242,193,78,0) 70%)}
@media (max-height:720px){#qWord{font-size:36px}.ans{padding:5px 10px;font-size:15px}.ans.long{font-size:13px}.stick{width:96px;height:96px}.knob{width:44px;height:44px}.flickpad{width:80px;height:80px}.ctl{gap:4px}}
/* overlays */
.cutin{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:5}
.band{position:relative;width:150%;height:118px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(90deg,rgba(242,193,78,0) 0%,var(--gold) 18%,var(--gold-lt) 50%,var(--gold) 82%,rgba(242,193,78,0) 100%);transform:rotate(-6deg)}
.cutin.go .band{animation:cut 1.15s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes cut{0%{transform:translateX(-90%) rotate(-6deg)}20%{transform:translateX(0) rotate(-6deg)}78%{transform:translateX(3%) rotate(-6deg);opacity:1}100%{transform:translateX(90%) rotate(-6deg);opacity:0}}
.band img{height:104px;width:auto}
.ctext{display:flex;flex-direction:column;color:var(--night)}
.ctext b{font-family:var(--serif);font-size:34px;line-height:1.05}
.ctext span{font-size:12px;font-weight:800;letter-spacing:4px}
.result{position:absolute;inset:0;background:rgba(15,9,32,.9);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px;z-index:6}
.result h2{margin:0;font-family:var(--serif);font-size:40px;text-align:center;color:var(--gold)}
.result p{margin:0;text-align:center;color:var(--soft)}
.rtable{width:100%;border-collapse:collapse;font-size:15px}
.rtable th,.rtable td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
.rtable th{color:var(--muted);font-size:12px;letter-spacing:1px}
.rtable td.n{text-align:right;font-variant-numeric:tabular-nums}
.how{margin:0;padding:10px 12px;border-radius:12px;background:rgba(46,230,214,.07);border:1px solid rgba(46,230,214,.3);font-size:13px;line-height:1.5;color:var(--soft)}
</style>
</head>

/* ------------------------------------------------------------------ network (MQTT over WebSocket) */
const myId = Math.random().toString(36).slice(2, 10);
const Net = {
  client: null, topic: '', room: '', isHost: false, state: 'off', peers: {}, hostSeenAt: 0,
  open: function (room, asHost) {
    this.close();
    this.room = room; this.isHost = asHost; this.topic = 'tangoswipe/raid1/' + room;
    this.peers = {}; this.hostSeenAt = asHost ? Date.now() : 0; this.state = 'connecting';
    renderNet();
    const self = this;
    let c;
    try {
      c = mqtt.connect(brokerUrl(), {
        clientId: 'ts_' + myId, clean: true, keepalive: 20, reconnectPeriod: 2500, connectTimeout: 10000,
        will: { topic: this.topic, payload: JSON.stringify({ t: 'bye', id: myId }), qos: 0, retain: false }
      });
    } catch (e) { this.state = 'error'; renderNet(); return; }
    this.client = c;
    c.on('connect', function () {
      c.subscribe(self.topic, { qos: 0 }, function (err) {
        self.state = err ? 'error' : 'online'; renderNet();

    c.on('message', function (topic, payload) {
      let m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!m || typeof m !== 'object' || m.id === myId) return;
      onMsg(m);

    c.on('error', function () { self.state = 'error'; renderNet(); });
    c.on('offline', function () { self.state = 'error'; renderNet(); });
    c.on('reconnect', function () { if (self.state !== 'online') { self.state = 'connecting'; renderNet(); } });
  },
  close: function () {
    if (this.client) {
      try { this.send({ t: 'bye' }); } catch (e) {}
      const c = this.client; this.client = null;
      try { c.end(false); } catch (e) {}
    }
    this.state = 'off'; this.peers = {};
  },
  send: function (m) {
    if (!this.client || !this.client.connected) return;
    m.id = myId;
    try { this.client.publish(this.topic, JSON.stringify(m), { qos: 0, retain: false }); } catch (e) {}
  },
  hello: function () {
    this.send({ t: 'hi', n: S.name, h: this.isHost ? 1 : 0, st: screen === 'raid' && G.running ? 'raid' : 'room' });
  }
};

let roomNote = '';
function setNote(n) { roomNote = n || ''; renderNet(); }
function renderNet() {
  const el = $('netState'); const lm = $('lobbyMsg');
  const msg = Net.state === 'connecting' ? t('connecting') : Net.state === 'online' ? t('online') : Net.state === 'error' ? t('offline') : '';
  if (el) el.textContent = msg + (roomNote && Net.state === 'online' ? ' ' + roomNote : '');
  if (screen === 'lobby' && lm && Net.state === 'error') lm.textContent = t('offline');
}

setInterval(function () {
  if (!Net.client) return;
  Net.hello();
  const now = Date.now(); let changed = false;
  Object.keys(Net.peers).forEach(function (id) {
    if (now - Net.peers[id].seen > 7000) { toast(t('left', { n: Net.peers[id].n })); delete Net.peers[id]; delete G.others[id]; changed = true; }
  });
  if (changed && screen === 'room') renderRoom();
  // host vanished?
  if (!Net.isHost && Net.hostSeenAt && now - Net.hostSeenAt > 7000) {
    if (screen === 'raid' && G.running) { endRaid(false, true); }
    Net.hostSeenAt = 0;
    if (screen === 'room') setNote(t('hostLeft'));
  }
  if (!Net.isHost && screen === 'room' && !Net.hostSeenAt && Net.state === 'online' && now - roomEnteredAt > 5000) {
    if (roomNote !== t('hostLeft')) setNote(t('noRoom'));
  }
}, 2000);

function onMsg(m) {
  const now = Date.now();
  const p = Net.peers[m.id];
  if (m.t === 'bye') {
    if (p) { toast(t('left', { n: p.n })); delete Net.peers[m.id]; delete G.others[m.id]; if (screen === 'room') renderRoom(); }
    return;
  }
  if (m.t === 'hi') {
    const isNew = !p;
    Net.peers[m.id] = { n: String(m.n || '?').slice(0, 12), h: !!m.h, st: m.st, seen: now };
    if (m.h) Net.hostSeenAt = now;
    if (isNew) {
      sfx.join();
      if (screen === 'room') { toast(t('joined', { n: Net.peers[m.id].n })); }
      Net.hello(); // answer at once so newcomers see us fast
    }
    if (!Net.isHost && m.h) setNote(m.st === 'raid' && screen === 'room' ? t('inProgress') : '');
    if (screen === 'room') renderRoom();
    return;
  }
  if (p) p.seen = now;
  if (m.t === 'start') { if (screen === 'room' && Array.isArray(m.ids) && m.ids.indexOf(myId) >= 0) startRaid(m); return; }
  if (m.t === 'room') { if (screen === 'raid') { show('room'); renderRoom(); } return; }
  if (screen !== 'raid') return;
  if (m.t === 'p') { const o = other(m.id); o.tx = +m.x || 0; o.ty = +m.y || 0; return; }
  if (m.t === 'me') { const o = other(m.id); o.hearts = m.h; o.down = !!m.d; return; }
  if (m.t === 'atk') { if (!Net.isHost) addAttack(m); return; }
  if (m.t === 'hit') {
    const o = other(m.id); throwFx(o.x, o.y, m.k === 'skill' ? 5 : 1, false);
    if (Net.isHost && G.running) hostHit(+m.dmg || 0, m.k);
    return;
  }
  if (m.t === 'hp') {
    if (!Net.isHost) { Net.hostSeenAt = now; G.hp = m.hp; G.hpMax = m.max; G.sc = m.sc; if (typeof m.left === 'number') G.endAt = now + m.left; renderHud(); }
    return;
  }
  if (m.t === 'strike') { if (!Net.isHost) teamStrikeFx(); return; }
  if (m.t === 'cut') { cutin('手裏剣乱舞！', t('cutBy', { n: (p && p.n) || '?' })); return; }
  if (m.t === 'end') { if (!Net.isHost && G.running) endRaid(!!m.win, false, m.secs); return; }
  if (m.t === 'stat') { G.stats[m.id] = { n: (p && p.n) || m.n || '?', r: m.r, d: m.d, x: m.x }; renderResult(); return; }
}

/* ------------------------------------------------------------------ game state */
const W = 360;
let H = 640, GROUND = 374, STAGE = 237, MONY = 90, HUDB = 90;
const DUR = 120000, CHARGE = 6;
const HP_PER_PLAYER = TEST && qs.get('hp') ? Math.max(10, +qs.get('hp') || 450) : 450;
const G = {
  running: false, startedAt: 0, endAt: 0, hp: 1, hpMax: 1, sc: 0, ids: [],
  me: null, others: {}, attacks: [], fx: [], stats: {}, shake: 0, monFlash: 0,
  q: null, qAt: 0, locked: false, moveX: 0, keys: { l: false, r: false }
};
function other(id) {
  let o = G.others[id];
  if (!o) { o = G.others[id] = { x: 180, y: 0, tx: 180, ty: 0, hearts: 3, down: false }; }
  return o;
}
function freshMe() { return { x: 180, y: 0, vy: 0, hearts: 3, inv: 0, down: false, downUntil: 0, right: 0, wrong: 0, dmg: 0, hits: 0, charge: 0 }; }

/* host-only */
const Host = { nextAtk: 0, shots: 0, lastHp: 0, ticker: 0 };
function hostStart() {
  const ids = [myId].concat(Object.keys(Net.peers).filter(function (id) { return Net.peers[id].st !== 'raid'; })).slice(0, 4);
  const hpMax = HP_PER_PLAYER * ids.length;
  const m = { t: 'start', ids: ids, max: hpMax, dur: DUR };
  Net.send(m);
  startRaid(m);
}
function startRaid(m) {
  G.ids = m.ids.slice(); G.hpMax = m.max; G.hp = m.max; G.sc = 0;
  G.startedAt = Date.now(); G.endAt = G.startedAt + (m.dur || DUR);
  G.me = freshMe(); G.others = {}; G.attacks = []; G.fx = []; G.stats = {}; G.shake = 0;
  const n = G.ids.length;
  const spots = n === 1 ? [180] : n === 2 ? [120, 240] : n === 3 ? [90, 180, 270] : [70, 140, 220, 290];
  G.ids.forEach(function (id, i) { if (id === myId) G.me.x = spots[i]; else { const o = other(id); o.x = o.tx = spots[i]; } });
  G.running = true;
  $('result').hidden = true;
  show('raid');
  if (Net.isHost) {
    Host.nextAtk = Date.now() + 2600; Host.shots = 0;
    clearInterval(Host.ticker); Host.ticker = setInterval(hostTick, 100);
  }
  Net.hello();
  nextQuestion();
  renderHud();
}
function hostTick() {
  if (!G.running || !Net.isHost) return;
  const now = Date.now();
  if (G.hp <= 0) { hostEnd(true); return; }
  if (now >= G.endAt) { hostEnd(false); return; }
  if (now >= Host.nextAtk) spawnAttack(now);
  if (now - Host.lastHp > 1000) hostSendHp();
}
function hostSendHp() { Host.lastHp = Date.now(); Net.send({ t: 'hp', hp: G.hp, max: G.hpMax, sc: G.sc, left: Math.max(0, G.endAt - Date.now()) }); }
function hostHit(dmg, kind) {
  dmg = Math.max(0, Math.min(60, dmg));
  G.hp = Math.max(0, G.hp - dmg); G.monFlash = Date.now();
  if (kind === 'shot') {
    Host.shots++; G.sc = Host.shots % 8;
    if (Host.shots % 8 === 0) {
      const bonus = 20 * G.ids.length;
      G.hp = Math.max(0, G.hp - bonus);
      Net.send({ t: 'strike' }); teamStrikeFx();
    }
  }
  renderHud();
  hostSendHp();
  if (G.hp <= 0) hostEnd(true);
}
function hostEnd(win) {
  if (!G.running) return;
  const secs = Math.round((Date.now() - G.startedAt) / 1000);
  Net.send({ t: 'end', win: win ? 1 : 0, secs: secs });
  endRaid(win, false, secs);
}
function spawnAttack(now) {
  const rage = G.hp < G.hpMax / 2;
  const tele = rage ? 850 : 1150;
  const r = Math.random();
  let a;
  if (r < 0.4) {
    const xs = [G.me.x]; Object.keys(G.others).forEach(function (id) { xs.push(G.others[id].tx); });
    const x = Math.max(70, Math.min(290, xs[Math.floor(Math.random() * xs.length)] + (Math.random() * 60 - 30)));
    a = { t: 'atk', k: 'slam', x: Math.round(x), w: 130, in: tele };
  } else if (r < 0.75) {
    const lanes = [30, 70, 110, 150, 190, 230, 270, 310, 340].sort(function () { return Math.random() - 0.5; });
    a = { t: 'atk', k: 'volley', xs: lanes.slice(0, rage ? 5 : 4), in: tele };
  } else {
    a = { t: 'atk', k: 'sweep', d: Math.random() < 0.5 ? 1 : -1, in: tele };
  }
  Net.send(a); addAttack(a);

/* ------------------------------------------------------------------ attacks (every client draws them; each checks only its own player) */
function addAttack(m) {
  const now = Date.now();
  const tele = Math.max(300, Math.min(3000, +m.in || 1000));
  const a = { k: m.k, at: now + tele, tele: tele, hit: false };
  if (m.k === 'slam') { a.x = +m.x || 180; a.w = +m.w || 130; a.end = a.at + 420; }
  else if (m.k === 'volley') { a.xs = (m.xs || []).map(Number).slice(0, 6); a.end = a.at + 300; }
  else if (m.k === 'sweep') { a.d = m.d === -1 ? -1 : 1; a.end = a.at + 1400; }
  else return;
  G.attacks.push(a);
}
function sweepX(a, now) { const p = (now - a.at) / 1300; return a.d > 0 ? -20 + p * 400 : 380 - p * 400; }
function checkAttacks(now) {
  const me = G.me;
  G.attacks.forEach(function (a) {
    if (a.hit || now < a.at || me.down) return;
    if (a.k === 'slam' && now <= a.at + 220) { if (Math.abs(me.x - a.x) < a.w / 2 + 6) { a.hit = true; hurt(); } }
    else if (a.k === 'volley' && now <= a.at + 140) {
      for (let i = 0; i < a.xs.length; i++) { if (Math.abs(me.x - a.xs[i]) < 24 && me.y < 46) { a.hit = true; hurt(); break; } }
    } else if (a.k === 'sweep' && now <= a.at + 1300) { if (Math.abs(me.x - sweepX(a, now)) < 18 && me.y < 36) { a.hit = true; hurt(); } }
  });
  G.attacks = G.attacks.filter(function (a) { return now < a.end; });
}
function hurt() {
  const me = G.me, now = Date.now();
  if (now < me.inv || me.down) return;

  ctx.fillStyle = 'rgba(8,4,20,.5)'; ctx.beginPath(); ctx.ellipse(x, GROUND + 3, 18 - Math.min(8, y / 14), 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(x, gy);
  if (down) ctx.rotate(flip ? -Math.PI / 2.4 : Math.PI / 2.4);
  const spr = IMG.ninja[SPRITE_FOR[color]];
  if (spr && spr.naturalWidth) {
    const hgt = 70, wid = hgt * spr.naturalWidth / spr.naturalHeight;
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(spr, -wid / 2, -hgt, wid, hgt);
    top = -hgt;
  } else {
    ctx.fillStyle = '#1E1B33'; rr(-10, -10, 8, 10, 3); ctx.fill(); rr(2, -10, 8, 10, 3); ctx.fill();
    ctx.fillStyle = '#2B2B45'; ctx.strokeStyle = '#0B0618'; ctx.lineWidth = 2;
    rr(-13, -30, 26, 22, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = color; rr(-13, -20, 26, 4, 2); ctx.fill();
    ctx.fillStyle = '#2B2B45'; ctx.beginPath(); ctx.arc(0, -44, 17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#F2C9A0'; rr(-12, -48, 24, 11, 5); ctx.fill();
    ctx.fillStyle = '#0B0618'; ctx.beginPath(); ctx.arc(-5, -43, 2.2, 0, Math.PI * 2); ctx.arc(5, -43, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color; rr(-17, -58, 34, 7, 3); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(15, -55); ctx.quadraticCurveTo(27, -60 + Math.sin(now / 120) * 3, 32, -52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(15, -53); ctx.quadraticCurveTo(25, -52 + Math.sin(now / 140) * 3, 29, -45); ctx.stroke();
  }
  ctx.restore();
  if (IMG.tetsu.complete && IMG.tetsu.naturalWidth) {
    const th = 40, tw = th * IMG.tetsu.naturalWidth / IMG.tetsu.naturalHeight;
    const bob = Math.sin(now / 380 + x) * 3;
    const tx = flip ? x + 22 : x - 22 - tw;
    ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(IMG.tetsu, tx, gy - 64 + bob, tw, th); ctx.restore();
  }
  ctx.save();
  if (!FONT_FAMILY) FONT_FAMILY = getComputedStyle(document.body).fontFamily || 'sans-serif';
  ctx.font = '800 13px ' + FONT_FAMILY; ctx.textAlign = 'center';
  ctx.globalAlpha = Math.max(0.6, alpha);
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,6,30,.85)'; ctx.strokeText(name, x, gy + top - 8);
  ctx.fillStyle = isMe ? '#2EE6D6' : color; ctx.fillText(name, x, gy + top - 8);
  ctx.restore();
}
function draw(now) {
  const v = view;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(sceneCv, 0, 0);
  let sx = 0, sy = 0;
  if (now - G.shake < 250) { sx = (Math.random() - 0.5) * 8; sy = (Math.random() - 0.5) * 8; }
  ctx.setTransform(v.s * v.dpr, 0, 0, v.s * v.dpr, sx * v.dpr, sy * v.dpr);
  // the Kappa on its stage
  const rage = G.hp < G.hpMax / 2;
  const cx = 180, cy = MONY + 80;
  const aura = ctx.createRadialGradient(cx, cy, 10, cx, cy, 120);
  aura.addColorStop(0, rage ? 'rgba(255,79,163,.5)' : 'rgba(255,79,163,.24)'); aura.addColorStop(1, 'rgba(255,79,163,0)');
  ctx.fillStyle = aura; ctx.beginPath(); ctx.ellipse(cx, cy, 130, 95, 0, 0, Math.PI * 2); ctx.fill();
  const bob = Math.sin(now / 520) * 3;
  const flash = now - G.monFlash < 120;
  if (IMG.kappa.complete && IMG.kappa.naturalWidth) {
    const mh = 150, mw = mh * IMG.kappa.naturalWidth / IMG.kappa.naturalHeight, mx = cx - mw / 2, my = MONY + bob;
    ctx.drawImage(IMG.kappa, mx + (flash ? 3 : 0), my, mw, mh);
    if (flash) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.45; ctx.drawImage(IMG.kappa, mx + 3, my, mw, mh); ctx.restore(); }
  }
  // attack warnings and hits
  G.attacks.forEach(function (a) {
    const pre = a.at - now;
    if (a.k === 'slam') {
      if (pre > 0) {
        const pulse = 0.25 + 0.2 * Math.sin(now / 70);
        ctx.fillStyle = 'rgba(255,79,163,' + pulse.toFixed(2) + ')'; ctx.strokeStyle = '#FF4FA3'; ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
        ctx.beginPath(); ctx.ellipse(a.x, GROUND + 4, a.w / 2, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
        const fall = Math.max(0, pre / a.tele);
        ctx.fillStyle = '#4CC38A'; ctx.strokeStyle = '#1B1035'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(a.x, GROUND - 30 - fall * 140, 22, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else {
        const k = (now - a.at) / 420;
        ctx.fillStyle = 'rgba(255,79,163,' + (0.8 * (1 - k)).toFixed(2) + ')';
        ctx.beginPath(); ctx.ellipse(a.x, GROUND + 3, a.w / 2 + k * 30, 14 + k * 10, 0, 0, Math.PI * 2); ctx.fill();
      }
    } else if (a.k === 'volley') {
      a.xs.forEach(function (x) {
        if (pre > 0) {
          ctx.strokeStyle = 'rgba(255,79,163,.85)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.ellipse(x, GROUND + 3, 22, 7, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
          if (pre < 600) {
            const k = 1 - pre / 600, oy0 = MONY + 102;
            const ox = 180 + (x - 180) * k, oy = oy0 + (GROUND - oy0) * k;
            ctx.fillStyle = 'rgba(255,79,163,.3)'; ctx.beginPath(); ctx.arc(ox, oy, 14, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FF4FA3'; ctx.beginPath(); ctx.arc(ox, oy, 7, 0, Math.PI * 2); ctx.fill();
          }
        } else {
          const k = (now - a.at) / 300;
          ctx.fillStyle = 'rgba(255,79,163,' + (0.7 * (1 - k)).toFixed(2) + ')'; ctx.beginPath(); ctx.arc(x, GROUND, 10 + k * 18, 0, Math.PI * 2); ctx.fill();
        }
      });
    } else if (a.k === 'sweep') {
      if (pre > 0) {
        const sxp = a.d > 0 ? 18 : W - 18;
        ctx.fillStyle = 'rgba(255,79,163,' + (0.5 + 0.4 * Math.sin(now / 80)).toFixed(2) + ')';
        ctx.beginPath(); ctx.moveTo(sxp, GROUND - 40); ctx.lineTo(sxp + a.d * 26, GROUND - 25); ctx.lineTo(sxp, GROUND - 10); ctx.closePath(); ctx.fill();
        ctx.font = '800 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('JUMP!', sxp + a.d * 34, GROUND - 48);
      } else {
        const x = sweepX(a, now);
        const grd = ctx.createLinearGradient(x - 30 * a.d, 0, x, 0);
        grd.addColorStop(0, 'rgba(255,79,163,0)'); grd.addColorStop(1, 'rgba(255,79,163,.9)');
        ctx.fillStyle = grd; ctx.beginPath();
        ctx.moveTo(x - 40 * a.d, GROUND); ctx.quadraticCurveTo(x - 6 * a.d, GROUND - 40, x + 6 * a.d, GROUND); ctx.closePath(); ctx.fill();
      }
    }
  });
  // players
  Object.keys(G.others).forEach(function (id) {
    const o = G.others[id]; const p = Net.peers[id];
    ninja(o.x, o.y, colorFor(id), o.down ? 0.45 : 1, (p && p.n) || '?', false, o.down, now);
  });
  const me = G.me;
  if (me) {
    const blink = now < me.inv && Math.floor(now / 90) % 2 === 0;
    ninja(me.x, me.y, '#2EE6D6', me.down ? 0.45 : blink ? 0.35 : 1, S.name, true, me.down, now);
  }
  // shuriken, damage numbers, team-strike slashes
  G.fx.forEach(function (f) {
    const k = (now - f.t0) / f.dur;
    if (k < 0 || k > 1) return;
    if (f.k === 'star') {
      const x = f.x0 + (f.x1 - f.x0) * k, y = f.y0 + (f.y1 - f.y0) * k - Math.sin(k * Math.PI) * 30;
      star(x, y, 9, now / 40);
    } else if (f.k === 'num') {
      ctx.save(); ctx.globalAlpha = 1 - k * k; ctx.textAlign = 'center';
      ctx.font = '900 ' + (f.big ? 30 : 22) + 'px sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = '#1B1035'; ctx.strokeText(f.txt, f.x, f.y - k * 30);
      ctx.fillStyle = f.big ? '#FFE7A3' : '#F6F1E7'; ctx.fillText(f.txt, f.x, f.y - k * 30);
      ctx.restore();
    } else if (f.k === 'slash') {
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#FFE7A3'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(60 + k * 40, MONY + 22); ctx.lineTo(300 - k * 40, MONY + 142); ctx.moveTo(300 - k * 40, MONY + 22); ctx.lineTo(60 + k * 40, MONY + 142); ctx.stroke();
      ctx.restore();
    }
  });
  G.fx = G.fx.filter(function (f) { return now - f.t0 < f.dur + 200; });
}

/* ------------------------------------------------------------------ loop */
let lastT = performance.now(), lastPos = { x: -1, y: -1, t: 0 };
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastT) / 1000); lastT = ts;
  const now = Date.now();
  if (screen === 'raid' && G.me) {
    const me = G.me;
    if (G.running) {
      if (me.down && now >= me.downUntil) { me.down = false; me.hearts = 2; me.inv = now + 1500; lockAnswers(false); Net.send({ t: 'me', h: 2, d: 0 }); }
      let mv = G.moveX; if (G.keys.l) mv = -1; if (G.keys.r) mv = 1;
      if (!me.down) me.x = Math.max(20, Math.min(W - 20, me.x + mv * 230 * dt));
      if (me.y > 0 || me.vy > 0) { me.vy -= 1600 * dt; me.y += me.vy * dt; if (me.y <= 0) { me.y = 0; me.vy = 0; } }
      checkAttacks(now);
      if ((Math.abs(me.x - lastPos.x) > 1.5 || Math.abs(me.y - lastPos.y) > 1.5) && now - lastPos.t > 110 || now - lastPos.t > 1000) {
        lastPos = { x: me.x, y: me.y, t: now };
        Net.send({ t: 'p', x: Math.round(me.x), y: Math.round(me.y) });
      }
      $('timer').textContent = fmtTime(G.endAt - now);
      if (me.down) renderHud();
    }
    Object.keys(G.others).forEach(function (id) {
      const o = G.others[id]; const k = Math.min(1, dt * 12);
      o.x += (o.tx - o.x) * k; o.y += (o.ty - o.y) * k;
    });
    draw(now);
  }
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ start */
$('nameIn').value = S.name;
if (qs.get('room')) { $('codeIn').value = qs.get('room').toUpperCase().slice(0, 4); }
applyText();
requestAnimationFrame(frame);
if (typeof mqtt === 'undefined') { $('lobbyMsg').textContent = 'Network library missing.'; }

if (TEST) {
  window.__raid = {
    G: G, S: S, Net: Net, myId: myId,
    correct: function () { return G.q ? G.q.correct : -1; },
    answer: answer, useSkill: useSkill, hurt: hurt, screen: function () { return screen; }
  };
}
})();
</script>
